[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-public-transport"
version = "0.2.0"
description = "An MCP-compatible server for querying public transport data in Europe (UK, CH, BE, NO, Berlin/Brandenburg, PT)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Miro Duman", email = "dumanmiro@gmail.com" }
]
keywords = ["mcp", "public transport", "api", "europe", "fastmcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.12.14",
    "certifi>=2025.7.14",
    "fastmcp>=2.10.6",
    "python-dotenv>=1.1.1",
    "typing-extensions>=4.8",
    "pydantic>=2.6",
]

[project.scripts]
mcp-server-public-transport = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.4.5",      
]

[project.urls]
Homepage = "https://github.com/mirodn/mcp-server-public-transport"
Repository = "https://github.com/mirodn/mcp-server-public-transport"

# flat layout: setuptools skips a top-level "tools" package and single modules
# during auto-discovery, so list everything the server needs explicitly
[tool.setuptools]
packages = ["core", "tools"]
py-modules = ["server", "config"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]
